<div class="profile-card">
  <img src="profile.jpg" alt="Profile Picture">

  <h2>{{ studentName }}</h2>
  <h3>{{ studentNumber }}</h3>
  <p>{{ course }}</p>
  <p>{{ yearLevel }}</p>
  <p>{{ section }}</p>
  <p>{{ nickname.toUpperCase() }}</p>
  <p>{{ studentName.toLowerCase().replaceAll(' ', '.') + '@dbtc-cebu.edu.ph' }}</p>

  <p>{{ grade }}</p>
  <b>{{ grade>=1.0 && grade<=3 ? 'Passed' : 'Failed' }}</b>

</div>

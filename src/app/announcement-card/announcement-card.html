<h1>ANNOUNCEMENTS:</h1>

<div *ngFor="let announcement of announcements" 
     class="announcement-card" 
     [class.pinned]="announcement.isPinned">
  <h3>{{ announcement.title }}</h3>
  <p>{{ announcement.description }}</p>
  <p><strong>Author:</strong> {{ announcement.author }}</p>
  <p><strong>Date:</strong> {{ announcement.date }}</p>

  <div class="button-group">
    <button 
      class="pin-btn" 
      [class.active]="announcement.isPinned"
      (click)="pinClicked(announcement)">
      {{ announcement.isPinned ? '📌 Pinned' : 'Pin' }}
    </button>
    <button class="delete-btn" (click)="deleteAnnouncement(announcement.title)">Delete</button>
  </div>
</div>
